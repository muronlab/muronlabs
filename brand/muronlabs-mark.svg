<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Muronlabs">
  <defs>
    <!-- Brand gradient: violet → pink → coral. -->
    <linearGradient id="mu-grad" x1="30" y1="20" x2="210" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#934BF0"/>
      <stop offset=".55" stop-color="#FA7FD8"/>
      <stop offset="1" stop-color="#FA7465"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="120" fill="url(#mu-grad)"/>
  <!-- The μ: one stem with a descender, a round bowl, a second stem; then the brand dot. Optically centred. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M70 60 V182"/>
    <path d="M70 104 A38 38 0 0 0 146 104 V60"/>
  </g>
  <circle cx="176" cy="128" r="13" fill="#FFFFFF"/>
</svg>
