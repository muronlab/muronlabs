<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Muronlabs">
  <defs>
    <!-- The brand dot: purple → pink → coral, as in the Mur●nlabs wordmark. -->
    <linearGradient id="dot" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#934BF0"/>
      <stop offset=".55" stop-color="#FA7FD8"/>
      <stop offset="1" stop-color="#FA7465"/>
    </linearGradient>
    <!-- Soft glow behind the dot. -->
    <radialGradient id="glow" cx="32" cy="33" r="27" gradientUnits="userSpaceOnUse">
      <stop offset=".45" stop-color="#FA7FD8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FA7FD8" stop-opacity="0"/>
    </radialGradient>
    <!-- Glossy highlight on the upper-left of the dot. -->
    <radialGradient id="shine" cx="24" cy="22" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Dark tile, readable on light and dark browser tabs. -->
    <rect width="64" height="64" fill="#121211"/>
    <circle cx="32" cy="33" r="27" fill="url(#glow)"/>
    <circle cx="32" cy="32" r="17" fill="url(#dot)"/>
    <circle cx="32" cy="32" r="17" fill="url(#shine)"/>
  </g>
  <!-- Hairline edge so the tile holds its shape on dark tab bars. -->
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
